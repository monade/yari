<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ESP32 Raycaster</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas.emscripten {
        display: block;
        border: 0;
        background: #000;
        image-rendering: pixelated;
      }

      #output {
        display: none;
      }

      #touch-controls {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 10;
        pointer-events: none;
      }

      @media (pointer: coarse) {
        #touch-controls {
          display: flex;
        }
      }

      .pad {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(3, 56px);
        gap: 6px;
        grid-template-areas:
          ".  n  ."
          "w  .  e"
          ".  s  .";
      }

      .pad-btn {
        pointer-events: auto;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font: 600 20px/1 system-ui, sans-serif;
        padding: 0;
      }

      .pad--actions .pad-btn {
        border-radius: 50%;
      }

      .pad--actions .pad-btn[data-area="s"] {
        background: rgba(255, 255, 255, 0.22);
      }

      .pad-btn.is-active {
        background: rgba(255, 255, 255, 0.4);
      }

      .pad-btn[data-area="n"] { grid-area: n; }
      .pad-btn[data-area="s"] { grid-area: s; }
      .pad-btn[data-area="w"] { grid-area: w; }
      .pad-btn[data-area="e"] { grid-area: e; }
    </style>
  </head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <pre id="output"></pre>
    <div id="touch-controls" oncontextmenu="event.preventDefault()"></div>
    <script>
      var Module = {
        print: (function() {
          var element = document.getElementById("output");
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
            console.log(text);
            if (element) {
              element.textContent += text + "\n";
              element.scrollTop = element.scrollHeight;
            }
          };
        })(),
        canvas: document.getElementById("canvas")
      };
    </script>
    <script>
      (function () {
        var DPAD = [
          { area: "n", label: "▲", keys: [{ code: "KeyW", key: "w", keyCode: 87 }] },
          { area: "w", label: "◀", keys: [{ code: "KeyA", key: "a", keyCode: 65 }] },
          { area: "s", label: "▼", keys: [{ code: "KeyS", key: "s", keyCode: 83 }] },
          { area: "e", label: "▶", keys: [{ code: "KeyD", key: "d", keyCode: 68 }] },
        ];

        // "n" fires both R and X: fps uses R (run/reload), kart uses X (brake) for the
        // same physical ESP32 button pin, so one overlay button covers either game.
        var ACTIONS = [
          { area: "n", label: "R", keys: [{ code: "KeyR", key: "r", keyCode: 82 }, { code: "KeyX", key: "x", keyCode: 88 }] },
          { area: "w", label: "Q", keys: [{ code: "KeyQ", key: "q", keyCode: 81 }] },
          { area: "e", label: "E", keys: [{ code: "KeyE", key: "e", keyCode: 69 }] },
          { area: "s", label: "●", keys: [{ code: "Space", key: " ", keyCode: 32 }] },
        ];

        function fireKey(type, k) {
          var evt = new KeyboardEvent(type, { key: k.key, code: k.code, bubbles: true, cancelable: true });
          try {
            Object.defineProperty(evt, "keyCode", { get: function () { return k.keyCode; } });
            Object.defineProperty(evt, "which", { get: function () { return k.keyCode; } });
          } catch (e) {}
          document.dispatchEvent(evt);
        }

        function buildPad(container, buttons, extraClass) {
          var pad = document.createElement("div");
          pad.className = "pad " + extraClass;
          buttons.forEach(function (btn) {
            var el = document.createElement("button");
            el.type = "button";
            el.className = "pad-btn";
            el.dataset.area = btn.area;
            el.textContent = btn.label;

            var active = false;
            var press = function (e) {
              e.preventDefault();
              if (active) return;
              active = true;
              el.classList.add("is-active");
              btn.keys.forEach(function (k) { fireKey("keydown", k); });
            };
            var release = function (e) {
              if (e) e.preventDefault();
              if (!active) return;
              active = false;
              el.classList.remove("is-active");
              btn.keys.forEach(function (k) { fireKey("keyup", k); });
            };

            el.addEventListener("pointerdown", press);
            el.addEventListener("pointerup", release);
            el.addEventListener("pointercancel", release);
            el.addEventListener("pointerleave", release);

            pad.appendChild(el);
          });
          container.appendChild(pad);
        }

        var controls = document.getElementById("touch-controls");
        buildPad(controls, DPAD, "pad--dpad");
        buildPad(controls, ACTIONS, "pad--actions");
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
